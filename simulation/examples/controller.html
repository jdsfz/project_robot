
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로봇 및 카메라 제어</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
}

body {
    height: min(900px, 100vh);
    max-height: 900px;
    padding: 12px;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

h1 {
    height: 32px;
    line-height: 32px;
    text-align: center;
    margin: 0 0 10px;
    font-size: 24px;
}

.layout {
    display: grid;
    grid-template-columns: minmax(0, 4fr) minmax(0, 2fr) minmax(0, 4fr);
    grid-template-rows: minmax(0, 52%) minmax(0, 1fr);
    gap: 12px;
    width: 100%;
    height: calc(100% - 42px);
    max-width: 1500px;
    margin: 0 auto;
}

.panel {
    background: white;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 2px 8px #00000012;
    min-width: 0;
    min-height: 0;
    overflow: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
}

.camera-panel {
    grid-column: 1 / 4;
    width: 100%;
    overflow: hidden;
}

/* 하단 순서: 2번 이동 제어(왼쪽), 4번 추가 제어(가운데), 3번 서보 제어(오른쪽) */
.layout > section:nth-of-type(2) {
    grid-column: 1;
    grid-row: 2;
}

.layout > section:nth-of-type(3) {
    grid-column: 3;
    grid-row: 2;
}

.layout > section:nth-of-type(4) {
    grid-column: 2;
    grid-row: 2;
}

.panel h2 {
    font-size: 19px;
    margin: 0 0 12px;
    text-align: center;
}

#camera {
    display: block;
    width: 100%;
    max-width: 1000px;
    height: 0;
    min-height: 0;
    flex: 1;
    max-height: 100%;
    object-fit: contain;
    background: #0f172a;
    border-radius: 8px;
    margin: 0 auto;
}

#cameraStatus {
    flex-shrink: 0;
    margin-top: 8px;
    font-size: 13px;
    color: #64748b;
    text-align: center;
}

.status {
    width: 100%;
    min-height: 38px;
    padding: 8px;
    margin: 8px 0;
    background: #f8fafc;
    border-radius: 8px;
    font-size: 13px;
    overflow-wrap: anywhere;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
}

.keys {
    display: grid;
    grid-template-columns: repeat(3, minmax(42px, 76px));
    gap: 8px;
    justify-content: center;
    margin: 12px auto;
}

.key {
    padding: 13px 0;
    border: 0;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 22px;
    font-weight: bold;
    user-select: none;
}

.key small {
    display: block;
    font-size: 11px;
    font-weight: normal;
}

.empty { visibility: hidden; }

.key.active { background: #16a34a; }

.speed-levels {
    display: flex;
    justify-content: center;
    gap: 5px;
    flex-wrap: wrap;
}

.speed-button,
.stop {
    border: 0;
    border-radius: 8px;
    padding: 6px 9px;
    color: white;
    background: #64748b;
    cursor: pointer;
    font-size: 13px;
}

.speed-button.active { background: #16a34a; }

.stop {
    display: block;
    margin: 12px auto 0;
    background: #dc2626;
    font-size: 15px;
}

.note {
    color: #64748b;
    font-size: 12px;
    text-align: center;
    line-height: 1.5;
    margin: 8px 0;
}

.servo-help {
    text-align: center;
    font-size: 13px;
    line-height: 1.7;
    color: #475569;
}

@media (max-width: 700px) {
    body {
        height: auto;
        max-height: none;
        min-height: 100vh;
        padding: 8px;
        overflow: auto;
    }

    h1 {
        height: auto;
        line-height: 1.4;
        margin-bottom: 10px;
    }

    .layout {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 280px auto auto auto;
        height: auto;
        max-height: none;
    }

    .camera-panel { grid-column: 1; grid-row: 1; height: 280px; }

    .layout > section:nth-of-type(2),
    .layout > section:nth-of-type(3),
    .layout > section:nth-of-type(4) {
        grid-column: 1;
        grid-row: auto;
    }

    .panel { padding: 12px; }
}
</style>
</head>

<body>
<h1>로봇 및 카메라 제어</h1>

<div class="layout">

    <!-- 1번: 카메라 화면 -->
    <section class="panel camera-panel">
        <h2>1번 화면 · 실시간 카메라</h2>
        <img id="camera" src="/video" alt="실시간 카메라 영상">
        <div id="cameraStatus">카메라 영상 연결 중</div>
    </section>

    <!-- 2번: 로봇 이동 제어 -->
    <section class="panel control-panel">
        <h2>2번 화면 · 로봇 이동 제어</h2>

        <div id="robotStatus" class="status">
            키보드 입력 대기 중
        </div>

        <div class="speed-levels" aria-label="속도 단계 선택">
            <button type="button" class="speed-button active"
                    data-speed="1">1단 (1)</button>
            <button type="button" class="speed-button"
                    data-speed="2">2단 (2)</button>
            <button type="button" class="speed-button"
                    data-speed="3">3단 (3)</button>
        </div>

        <div class="keys">
            <div class="empty"></div>
            <div class="key" id="keyW"><small>W</small>전진</div>
            <div class="empty"></div>

            <div class="key" id="keyA"><small>A</small>좌</div>
            <div class="key" id="keyS"><small>S</small>후진</div>
            <div class="key" id="keyD"><small>S</small>우</div>
        </div>

        <p class="note">
            W/S 이동 · WA/WD/SA/SD 방향 보정<br>
            WASD와 1·2·3 속도는 독립적으로 처리됩니다.
        </p>

    </section>

    <!-- 3번: 카메라 서보 제어 -->
    <section class="panel control-panel">
        <h2>3번 화면 · 카메라 서보 제어</h2>

        <div id="servoStatus" class="status">
            숫자패드 8/2/4/6으로 카메라 이동
        </div>

        <div class="keys">
            <div class="empty"></div>
            <div class="key" id="servo8"><small>8</small>상</div>
            <div class="empty"></div>

            <div class="key" id="servo4"><small>4</small>좌</div>
            <div class="key" id="servo5"><small>5</small>중앙</div>
            <div class="key" id="servo6"><small>6</small>우</div>

            <div class="empty"></div>
            <div class="key" id="servo2"><small>2</small>하</div>
            <div class="empty"></div>
        </div>

        <p class="servo-help">
            숫자패드 8=상 · 2=하 · 4=좌 · 6=우<br>
            방향키를 함께 누르면 대각선 이동<br>
            5=좌우 90°, 상하 55°로 중앙 복귀
        </p>
    </section>

    <!-- 4번: 추가 제어 버튼 영역 -->
    <section class="panel extra-panel">
        <h2>4번 화면 · 추가 제어</h2>
        <button class="stop" id="robotStop" type="button">로봇 정지</button>
    </section>

</div>

<script>
const robotKeys = new Set();
const servoKeys = new Set();

let speedLevel = 1;
let robotSending = false;
let robotPending = null;
let servoSending = false;
let servoPending = null;
let servoTimer = null;

const robotStatus = document.getElementById('robotStatus');
const servoStatus = document.getElementById('servoStatus');

/* 로봇 제어 */
function robotUrl() {
    return '/control?keys=' +
        encodeURIComponent([...robotKeys].sort().join('')) +
        '&speed=' + speedLevel;
}

async function sendRobot() {
    ['w', 'a', 's', 'd'].forEach(k => {
        document.getElementById('key' + k.toUpperCase())
            .classList.toggle('active', robotKeys.has(k));
    });

    robotPending = robotUrl();

    if (robotSending) return;
    robotSending = true;

    try {
        while (robotPending !== null) {
            const url = robotPending;
            robotPending = null;

            const response = await fetch(url, { cache: 'no-store' });
            robotStatus.textContent = await response.text();
        }
    } catch (error) {
        robotStatus.textContent = '로봇 제어 전송 실패';
    } finally {
        robotSending = false;
    }
}

function selectSpeed(level) {
    speedLevel = level;

    document.querySelectorAll('.speed-button').forEach(button => {
        button.classList.toggle(
            'active',
            Number(button.dataset.speed) === level
        );
    });

    sendRobot();
}

document.querySelectorAll('.speed-button').forEach(button => {
    button.addEventListener('click', () => {
        selectSpeed(Number(button.dataset.speed));
    });
});

/* 서보모터 제어 */
function updateServoKeys() {
    ['8', '2', '4', '5', '6'].forEach(key => {
        document.getElementById('servo' + key)
            .classList.toggle('active', servoKeys.has(key));
    });
}

function servoUrl() {
    return '/servo?keys=' +
        encodeURIComponent([...servoKeys].sort().join(''));
}

async function sendServo() {
    updateServoKeys();
    servoPending = servoUrl();

    if (servoSending) return;
    servoSending = true;

    try {
        while (servoPending !== null) {
            const url = servoPending;
            servoPending = null;

            const response = await fetch(url, { cache: 'no-store' });
            servoStatus.textContent = await response.text();
        }
    } catch (error) {
        servoStatus.textContent = '서보 제어 전송 실패';
    } finally {
        servoSending = false;
    }
}

function stopServoRepeat() {
    if (servoTimer !== null) {
        clearInterval(servoTimer);
        servoTimer = null;
    }
}

function startServoRepeat() {
    stopServoRepeat();

    if ([...servoKeys].some(key => ['8', '2', '4', '6'].includes(key))) {
        sendServo();
        servoTimer = setInterval(sendServo, 120);
    }
}

/* 키 입력 초기화 */
function clearAllKeys() {
    robotKeys.clear();
    servoKeys.clear();
    stopServoRepeat();
    sendRobot();
    sendServo();
}

/* 키보드 입력 */
document.addEventListener('keydown', event => {
    const key = event.key.toLowerCase();
    const numpad = event.code.startsWith('Numpad')
        ? event.code.slice(6)
        : null;

    // 상단 숫자 1·2·3은 로봇 속도 조절
    if (['1', '2', '3'].includes(key) &&
        !event.code.startsWith('Numpad')) {
        event.preventDefault();
        selectSpeed(Number(key));
        return;
    }

    // WASD 로봇 이동
    if (['w', 'a', 's', 'd'].includes(key)) {
        event.preventDefault();

        if (!robotKeys.has(key)) {
            robotKeys.add(key);
            sendRobot();
        }
        return;
    }

    // 숫자패드로 서보모터 제어
    if (['8', '2', '4', '6', '5'].includes(numpad)) {
        event.preventDefault();

        if (numpad === '5') {
            servoKeys.clear();
            servoKeys.add('5');
            stopServoRepeat();
            sendServo();
            return;
        }

        if (!servoKeys.has(numpad)) {
            servoKeys.add(numpad);
            servoKeys.delete('5');
            startServoRepeat();
        }
    }
});

document.addEventListener('keyup', event => {
    const key = event.key.toLowerCase();

    if (robotKeys.delete(key)) {
        sendRobot();
    }

    const numpad = event.code.startsWith('Numpad')
        ? event.code.slice(6)
        : null;

    if (numpad && servoKeys.delete(numpad)) {
        if (servoKeys.has('5')) {
            servoKeys.delete('5');
        }

        startServoRepeat();

        if (servoKeys.size === 0) {
            sendServo();
        }
    }
});

document.getElementById('robotStop').addEventListener('click', () => {
    robotKeys.clear();
    sendRobot();
});

window.addEventListener('blur', clearAllKeys);

/* 카메라 연결 상태 */
window.addEventListener('load', () => {
    const camera = document.getElementById('camera');
    const cameraStatus = document.getElementById('cameraStatus');

    camera.addEventListener('error', () => {
        cameraStatus.textContent =
            '카메라 연결 실패: 카메라 장치/권한을 확인하세요.';
    });

    camera.addEventListener('load', () => {
        cameraStatus.textContent = '카메라 영상 연결됨';
    });
});
</script>

</body>
</html>
